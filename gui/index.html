<!DOCTYPE html>
<html itemscope="" itemtype="http://schema.org/WebPage" lang="en-HK">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">
	<head>
			<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
			<script>
				var ws_server = function(on_data)
				{
					var ws = null;
					this.send = function (msg) 
					{
						if (null != ws)
						{
							ws.send(msg);
							return true;
						}
						return false;
					}
					var start = function () 
					{
						try 
						{
							ws = new WebSocket("ws://" + location.host + "/");
							ws.onclose = (event) =>
							{
								ws = null;
								setTimeout(start, 5000);
							};
							ws.onerror = (event) => 
							{
								ws.close();
							};
							ws.onmessage = (event) => 
							{
								on_data(event.data);
							};
						}
						catch (e) 
						{
							setTimeout(start, 5000);
						}
					}
					this.start = () => 
					{
						start();
					}
				}
				var init = function()
				{
					var output = $("#output");
					var input = $("#input");
					var send = $("#send");
					var ws = new ws_server((txt)=>
					{
						try
						{
							output.append(txt + "\n");
						}
						catch(e)
						{
							alert("parse JSON error:" + txt + ",err:" + e);
						}
					});
					ws.start();
					send.click( () => 
					{
						let txt = input.val();
						try
						{
							JSON.parse(txt);
							output.append(txt + "\n");
							if (!ws.send(txt))
							{
								alert("send msg:" + txt + "  fail, websocket disconnected");
							}
						}
						catch(e)
						{
							alert("parse JSON error:" + txt + ",err:" + e);
						}
                    });
				}
				$(document).ready(()=>
				{
					init();
				});
			</script>
	</head>
	<body>
			<form action="/logout" method="POST"><input type="submit" value="Logout"></form>
			<br/>
			<textarea rows="32" cols="320" id="output" readonly></textarea>
			<br/>
			<input type="text" id="input"/>
			<input type="button" value="send" id="send"/>
	</body>
</html>
