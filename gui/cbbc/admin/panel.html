<html>
<head>
  <title>Admin</title>
  <script type="application/javascript" src="/js/jquery-3.3.1.slim.min.js"></script>
  <script type="application/javascript" src="/js/bootstrap.min.js"></script>
  <script type="application/javascript" src="/js/jquery.dataTables.min.js"></script>
  <script type="application/javascript" src="/js/dataTables.bootstrap4.min.js"></script>
  <script type="application/javascript" src="/js/js-cookie.js"></script>
  <script type="application/javascript" src="/js/websocket-io.js"></script>
  <script type="application/javascript" src="/page/general.js"></script>
  
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/dataTables.bootstrap4.min.css">
  <link rel="stylesheet" href="/css/general.css">
  <style>
  .table th, .table td {
    padding: .25rem .75rem; font-size: 12px;
  }
  .textarea-msg, .btn-sm {
    font-size: 12px;
  }
  .btn-send, .btn-logout {
    width: 60px;
  }
  #tb-users input {
    width: 80px;
    border: 0px solid #ccc !important;
    background-color: rgba(0, 0, 0, 0);
    padding: 2px 0px 0px 2px;
  }
  #tb-users td {
    padding: 2px;
  }
  .dataTables_filter {
    display: None;
  }
  </style>
  <script>
  var ui = {};      // 组件
  global.host = location.host;
  
  $(document).ready(function() {
    initUI();
    
    ui.rowSocketTest.hide();
    ui.rowSocketList.hide();
  
    // 1.0 data
    $.ajax({
      type: "POST",
      crossDomain: true,
      url: "http://"+global.host+"/status",
      success: function(res) {
        // 1.1 socket
        if (('conns' in res) && Object.keys(res.conns).length>0) {
          var html = '';
          for (const [userId, origin] of Object.entries(res.conns)) {
            for (const [k, v] of Object.entries(origin)) {
              var taId = 'textarea-'+userId.toString()+'-'+k.toString();
              html += '<tr>';
              html += '<td>'+userId.toString()+'</td>';
              html += '<td>'+k.toString()+'</td>';
              html += '<td>'+v.toString()+'</td>';
              html += '<td> <textarea class="form-control textarea-msg" id="'+taId+'" rows="1"></textarea> </td>';
              html += '<td>';
              html += '<button data-user="'+userId.toString()+'" data-origin="'+k.toString()+'" data-msg="'+taId+'" class="btn btn-sm btn-primary btn-send">Send</button>';
              html += '<button data-user="'+userId.toString()+'" data-origin="'+k.toString()+'" data-msg="'+taId+'" class="btn btn-sm btn-danger btn-logout">Logout</button>';
              html += '</td>';
              html += '</tr>';
            }
          }
          ui.tbConns.children('tbody').html(html);
        }
        else if (!('conns' in res) || Object.keys(res.conns).length==0) {
          var html = '<tr><td colspan="5">No Connection</td></tr>'
          ui.tbConns.children('tbody').html(html);
        }
        
        // 1.2 users
        if (('users' in res) && Object.keys(res.users).length>0) {
          var html = '';
          for (const [name, val] of Object.entries(res.users)) {
            global.colKeys = Object.keys(val);
            // 1.2.1 content
            html += '<tr>';
            html += '<td>'+name.toString()+'</td>';
            for (var [k, v] of Object.entries(val))
              html += '<td><input type="text" value="'+v+'"></input></td>';
            html += '<td><button class="btn btn-sm btn-secondary">Edit</button></td>';
            html += '</tr>';
            // 1.2.2 columns
            var columns = Object.keys(val), columns2 = [];
            columns.unshift('name');
            for (var v2 of columns) columns2.push({title: v2, orderDataType: 'dom-text', type: "numeric"});
          }
          columns2.push({title: 'Action'});
          // 1.2.3
          ui.tbUsers.children('tbody').html(html);
          var columnDefs = [{targets: [1], visible: false,}, {targets: [2], visible: false,}];
          global.dtUsers = ui.tbUsers.DataTable({searching: true, paging: false, info: false, order: [[0, "asc"]], columns: columns2, columnDefs: columnDefs});
          // 1.2.4 apply filter
          var group = null, role = null, uname = global.cookies['admin-uname'];
          if (uname in res.users)
            group = res.users[uname].userGroup, role = res.users[uname].userRole
          if (role==2)
            global.dtUsers.search('').draw();
          else if (role==1)
            global.dtUsers.columns(7).search(group).draw();
          else if (role==0)
            global.dtUsers.columns(0).search(group).draw();
          // 1.2.5
          if (role==2) {
            ui.rowSocketTest.show();
            ui.rowSocketList.show();
          }
          else if (role==0 && uname != 'admin') {
            global.func.logout();
          }
        }
        else if (!('users' in res) || Object.keys(res.users).length==0) {
          var html = '<tr><td colspan="5">No Users</td></tr>'
          ui.tbUsers.children('tbody').html(html);
        }
      },
      // 1.3 post process
      complete: function() {
        initUI();
        handleSend();
        handleClick();
      }
    });
    
    // 1.5
    function handleClick() {
      ui.tbUsers.children('tbody').on('click', 'button', function (e) {
        // var data = global.dtUsers.row($(this).parents('tr')).data();
        var that = $(this).parents('tr'),
            data = {};
        for (var i in global.colKeys) {
          var k = parseInt(i)+1;
          data[global.colKeys[i]] = that.find("td:eq("+k+") input").val();
        }
        data.name = that.find("td:eq(0)").html();
        console.log(data);
      });
    }
    
    // 1.4 handle socket
    function handleSend() {
      // 1.4.1
      ui.btnSend.click(function() {
        var userId = $(this).data('user'),
            origin = $(this).data('origin'),
            msgId =  $(this).data('msg');
        var msg = $('#'+msgId).val();
        if (!msg || msg.toString().length==0)
          msg = JSON.stringify({"action":"block_trade"});
        else
          msg = JSON.stringify({"admin_message":msg});
        var data = {userId: userId, origin: origin, msg: msg};
        
        $.ajax({
          type: "POST",
          crossDomain: true,
          url: "/admin-send-msg",
          data: data,
          success: function(res) {}
        });
        
      });
      // 1.4.2
      ui.btnLogout.click(function() {
        var userId = $(this).data('user'),
            origin = $(this).data('origin'),
            msg = JSON.stringify({action: 'connect_reject', error: 'Force to Logout!'});
            
        var data = {userId: userId, origin: origin, msg: msg};
        $.ajax({
          type: "POST",
          crossDomain: true,
          url: "/admin-send-msg",
          data: data,
          success: function(res) {}
        });
      });
    }
    
    // 2.0 socket
    var render = (res) => {
      console.log(res);
    }
    initWebsocket(render)
    
    ui.btnSocket.click(function() {
      sendWebsocket(ui.tvSocket.val());
    });
    
  });
  
  function initUI() {
    ui.tbConns = $('#tb-conns');
    ui.tbUsers = $('#tb-users');
    ui.btnSend = $('.btn-send');
    ui.btnLogout = $('.btn-logout');
    ui.btnSocket = $('#btnSocket');
    ui.tvSocket = $('#tvSocket');
    ui.rowSocketTest = $('#row-socket-test');
    ui.rowSocketList = $('#row-socket-list');
  }
  </script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
<div class="container">
  <a class="navbar-brand" href="javascript:void(0);">Fast Trader Admin Panel</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarContent">
    <ul class="navbar-nav">
    <li class="nav-item" data-nav="home">
      <a class="nav-link" href="javascript:void(0);">home</a>
    </li>
    </ul>

    <ul class="navbar-nav ml-auto">
    <li class="nav-item">
      <form id="btn-logout-admin" action="admin-logout" method="POST" class="form-inline mb-0 mb-sm-0">
        <button class="btn btn-sm btn-outline-success" type="submit">Logout</button>
      </form>
    </li>
    </ul>
  </div>
  
</div>
</nav>

<div class="container">


<div class="row mb-4 mb-sm-4">
<div class="col-12 col-sm-12">
  <h6> Users </h6>
  <table class="table table-striped" id="tb-users" style="width:100%">
  <thead>
    <tr>
    </tr>
  </thead>
  <tbody>
  </tbody>
  </table>
</div>
</div>


<div class="row mb-4 mb-sm-4" id="row-socket-list">
<div class="col-12 col-sm-12">
  <h6> WS Socket </h6>
  <table class="table table-striped" id="tb-conns">
  <thead>
    <tr>
      <th scope="col">User Id</th>
      <th scope="col">Origin</th>
      <th scope="col">Owner</th>
      <th scope="col">Message</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
  </tbody>
  </table>
</div>
</div>

<div class="row mb-4 mb-sm-4" id="row-socket-test">
<div class="col-12 col-sm-12">
  <h6> Test Socket </h6>
  <form action="javascript:void(0);">
  <div class="form-group">
  <textarea class="form-control textarea-msg" id="tvSocket" rows="3">{"cmd":"get_warrent_underlying", "code": 15217, "algo_name":"leo_admin", "ref": "u000_1"}</textarea>
  </div>
  <button class="btn btn-sm btn-secondary" id="btnSocket">Submit</button>
  </form>
</div>
</div>


</div>
</body>
</html>
