<html>
<head>
  <title>Admin</title>
  <script type="application/javascript" src="/js/jquery-3.3.1.slim.min.js"></script>
  <script type="application/javascript" src="/js/bootstrap.min.js"></script>
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <style>
    form, #tvResult {padding: 10px; border: 1px solid #cfcfcf; background-color: #f9f9f9; font-size: 12px;}
    form .form-group {margin-bottom: 10px;}
    .col-form-label-sm, .form-control-sm, .btn-primary {font-size: 12px;}
  </style>
  <script>
  var ui = {};      // 组件
  var global = {};  // 公共
  global.host = location.host;
  
  $(document).ready(function() {
    initUI();
    ui.tvErrorMsg.hide();
    
    /*ui.btnSubmit.click(function() {
      if (ui.tvAc.val() == 'fast_trader' && ui.tvPw.val() == '123a') {
        window.location.href = "/admin-panel";
      }
      else {
        ui.tvErrorMsg.text("Wrong name or password!");
        ui.tvErrorMsg.show();
      }
    });*/
  });
  
  function initUI() {
    ui.formLogin = $('#formLogin');
    ui.tvAc = $('input[name="user_name"]');
    ui.tvPw = $('input[name="password"]');
    ui.btnSubmit = $('#btnSubmit');
    ui.tvErrorMsg = $('#tvErrorMsg');
  }
  </script>
</head>
<body>
<div class="container">

<div class="row">
<div class="col-12 mt-4">
  <h6> Login </h6>
  <form id="formLogin" action="./admin-login" method="post">
    <div class="form-group row">
      <label for="user_name" class="col-sm-2 col-form-label col-form-label-sm">Name</label>
      <div class="col-sm-10">
        <input type="text" name="user_name" class="form-control form-control-sm" value="">
      </div>
    </div>
    <div class="form-group row">
      <label for="password" class="col-sm-2 col-form-label col-form-label-sm">Password</label>
      <div class="col-sm-10">
        <input type="text" name="password" class="form-control form-control-sm" value="">
      </div>
    </div>
    <button type="submit" id="btnSubmit" class="btn btn-sm btn-primary">Submit</button>
  </form>
  <div id="tvErrorMsg" class="alert alert-danger" role="alert"></div>
</div>
</div>

</div>
</body>
</html>
