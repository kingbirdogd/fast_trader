<html>
<head>
  <title>Save JSON for HTS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/js/bootstrap.bundle.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css"/>
  <style>
    form {margin: 10px; padding: 10px; border: 1px solid #cfcfcf; background-color: #f9f9f9; font-size: 12px;}
    form .form-group { margin-bottom: 10px; }
  </style>
  <script>
  $(document).ready(function() {
    var url = location.host;
    initUI();
    
    // save data
    ui.btnSave.click(function() {
      $.ajax({
        type: "POST",
        crossDomain: true,
        url: "http://"+url+"/saveData",
        data: getFormData(ui.formSave),
        success: function(res) {
          console.log(res);
        }
      });
    });
    
    // load data
    ui.btnLoad.click(function() {
      $.ajax({
        type: "POST",
        crossDomain: true,
        url: "http://"+url+"/loadData",
        data: getFormData(ui.formLoad),
        success: function(res) {
          console.log(res);
        }
      });
    });
    
    // delete data
    ui.btnDelete.click(function() {
      $.ajax({
        type: "POST",
        crossDomain: true,
        url: "http://"+url+"/deleteData",
        data: getFormData(ui.formDelete),
        success: function(res) {
          console.log(res);
        }
      });
    });
    
  });
  
  var ui = {};
  
  function initUI() {
    ui.btnSave = $('#btnSave');
    ui.btnLoad = $('#btnLoad');
    ui.btnDelete = $('#btnDelete');
    
    ui.formSave = $('#formSave');
    ui.formLoad = $('#formLoad');
    ui.formDelete = $('#formDelete')
  }
  
  function getFormData(obj) {
    var data = {};
    $.each(obj.serializeArray(), function(_, kv) {
      data[kv.name] = kv.value;
    });
    return data;
  }
  </script>
</head>
<body>
  <div class="container">
  
    <div class="row">
    <div class="col-12">
      <form id="formSave">
        <div class="form-group row">
          <label for="name" class="col-sm-2 col-form-label col-form-label-sm">Name</label>
          <div class="col-sm-10">
            <input type="text" name="name" class="form-control form-control-sm" value="wendy">
          </div>
        </div>
        <div class="form-group row">
          <label for="type" class="col-sm-2 col-form-label col-form-label-sm">Type</label>
          <div class="col-sm-10">
            <input type="text" name="type" class="form-control form-control-sm" value="hts">
          </div>
        </div>
        <div class="form-group row">
          <label for="data" class="col-sm-2 col-form-label col-form-label-sm">Data</label>
          <div class="col-sm-10">
            <input type="text" name="data" class="form-control form-control-sm" value="{'row1':'0700,450','row2':'9988, 220','setting','0,0,0,0'}">
          </div>
        </div>
        <button type="button" id="btnSave" class="btn btn-sm btn-primary">Save</button>
        <hr />
        [Post] http://url:port/saveData <br />
        [Param] {name: 'wendy', type: 'hts', data: json} <br />
      </form>
    </div>
    </div>
    
    <div class="row">
    <div class="col-12">
      <form id="formLoad">
        <div class="form-group row">
          <label for="name" class="col-sm-2 col-form-label col-form-label-sm">Name</label>
          <div class="col-sm-10">
            <input type="text" name="name" class="form-control form-control-sm" value="wendy">
          </div>
        </div>
        <div class="form-group row">
          <label for="type" class="col-sm-2 col-form-label col-form-label-sm">Type</label>
          <div class="col-sm-10">
            <input type="text" name="type" class="form-control form-control-sm" value="hts">
          </div>
        </div>
        <button type="button" id="btnLoad" class="btn btn-sm btn-success">load</button>
        <hr />
        [Post] http://url:port/loadData <br />
        [Param] {name: 'wendy', type: 'hts'} <br />
      </form>
    </div>
    </div>
    

    <div class="row">
    <div class="col-12">
      <form id="formDelete">
        <div class="form-group row">
          <label for="name" class="col-sm-2 col-form-label col-form-label-sm">Name</label>
          <div class="col-sm-10">
            <input type="text" name="name" class="form-control form-control-sm" value="wendy">
          </div>
        </div>
        <div class="form-group row">
          <label for="type" class="col-sm-2 col-form-label col-form-label-sm">Type</label>
          <div class="col-sm-10">
            <input type="text" name="type" class="form-control form-control-sm" value="hts">
          </div>
        </div>
      <button type="button" id="btnDelete" class="btn btn-sm btn-danger">Delete</button>
        <hr />
        [Post] http://url:port/deleteData <br />
        [Param] {name: 'wendy', type: 'hts'} <br />
      </form>
    </div>
  </div>
  
  </div>
</body>
</html>
